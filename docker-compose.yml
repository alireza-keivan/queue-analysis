services:
  storage-api:
    build: ./storage-api
    ports:
      - "8000:8000"  # exposed for direct curl/debugging
    environment:
      # ":?" (not ":-") - fail loudly at startup if this is missing, rather
      # than silently running with auth effectively disabled.
      - STORAGE_API_SECRET=${STORAGE_API_SECRET:?Set STORAGE_API_SECRET in your .env file}
    volumes:
      - storage-api-data:/app/data

  dashboard:
    build: ./dashboard
    ports:
      - "8080:8080"
    environment:
      # Service name, not localhost: compose puts both on the same network.
      - STORAGE_API_URL=http://storage-api:8000
      - STORAGE_API_SECRET=${STORAGE_API_SECRET:?Set STORAGE_API_SECRET in your .env file}
      - RUNPOD_API_KEY=${RUNPOD_API_KEY:-}
      - RUNPOD_ENDPOINT_ID=${RUNPOD_ENDPOINT_ID:-}
      # Set this once you have n8n's webhook Production URL, e.g.
      # http://n8n:5678/webhook/<id> - service name, not localhost.
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-}
    depends_on:
      - storage-api

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"           # web UI: http://localhost:5678
    environment:
      # Override in a .env file if this isn't your timezone - affects
      # schedule-trigger nodes only.
      - GENERIC_TIMEZONE=${N8N_TIMEZONE:-UTC}
      - TZ=${N8N_TIMEZONE:-UTC}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
    volumes:
      # Workflow definitions, credentials, and the auto-generated
      # encryption key all live here - must persist across restarts.
      - n8n-data:/home/node/.n8n
    depends_on:
      - storage-api
      - dashboard

volumes:
  storage-api-data:
  n8n-data: